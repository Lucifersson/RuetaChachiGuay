<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="src/assets/Logo circular simple negro.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="src/estilos/signup.css">
    <title>SIGN-UP</title>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-950 to-green-700 flex items-center justify-center">
<div class="absolute inset-0 bg-cover bg-center opacity-10 z-0"
     style="background-image: url('src/assets/textura-alfombra-tapete-textura-patron-textura-hilos-textura-tapizado-colores-arte-background_170698-160.avif');">
</div>

<div class="relative z-10 bg-white bg-opacity-90 rounded-lg shadow-lg p-8 w-80 flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center text-green-900 mb-4">Crear Cuenta</h2>

    <input id="username" type="text" aria-label="Nombre de usuario" placeholder="Nombre de usuario" class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700"/>

    <input id="password" type="password" aria-label="Contraseña" placeholder="Contraseña" class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700"/>

    <input id="birthdate" type="date" aria-label="Fecha de nacimiento" placeholder="Fecha de nacimiento" class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700"/>

    <div class="flex flex-col gap-2 mt-2">
        <button id="signupButton" class="bg-green-800 text-white rounded px-4 py-2 hover:bg-green-900 transition-colors">Entrar</button>
        <a href="/login.html" class="bg-transparent border border-green-800 text-green-800 rounded px-4 py-2 text-center hover:bg-green-100 transition-colors">Ya tengo cuenta</a>
    </div>
</div>

<script src="src/signup.js"></script>
</body>
</html>
